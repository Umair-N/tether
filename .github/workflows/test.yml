name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cd server && python3 -m unittest discover -q
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: cd ui && npm ci && npx tsc -b && npx eslint . && npm run build
      - run: cd ui && node run_ui_tests.cjs --unit
      - name: Check browser test paths
        id: browser-paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null || ! git diff --quiet "$BASE" HEAD -- ui/ .github/workflows/test.yml; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@v4
        if: steps.browser-paths.outputs.changed == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Install test Chromium
        if: steps.browser-paths.outputs.changed == 'true'
        run: cd ui && npx playwright-core install --with-deps --only-shell chromium
      - name: Browser UI tests
        if: steps.browser-paths.outputs.changed == 'true'
        run: cd ui && node run_ui_tests.cjs --browser
